<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sahil Rajput — Developer Profile</title>
  <desc id="desc">Dark premium banner with electric-blue gradients, abstract grid, and a developer terminal motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset=".58" stop-color="#0A1224"/>
      <stop offset="1" stop-color="#07101C"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset=".52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="40%" r="58%">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#60A5FA" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="970" cy="165" r="105" fill="#2563EB" opacity=".12" filter="url(#softGlow)"/>
    <path d="M850 0L1200 0 1200 360 1030 360Z" fill="#0F1F3D" opacity=".36"/>
    <path d="M860 0L1200 340M930 0L1200 270M1000 0L1200 200" stroke="#3B82F6" stroke-opacity=".15" stroke-width="1.5"/>
    <rect x="778" y="70" width="340" height="218" rx="18" fill="#070D18" stroke="#60A5FA" stroke-opacity=".34"/>
    <path d="M778 105H1118" stroke="#60A5FA" stroke-opacity=".22"/>
    <circle cx="800" cy="88" r="4" fill="#F87171"/>
    <circle cx="815" cy="88" r="4" fill="#FBBF24"/>
    <circle cx="830" cy="88" r="4" fill="#34D399"/>
    <text x="804" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#64748B">$ whoami</text>
    <text x="804" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#E2E8F0">Sahil Rajput</text>
    <text x="804" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#38BDF8">building thoughtful software_</text>
    <path d="M804 239H1025" stroke="url(#blue)" stroke-width="3" stroke-linecap="round"/>
    <text x="804" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">clean UI · useful tools · continuous learning</text>
    <text x="76" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="4" fill="#60A5FA">DEVELOPER PROFILE / 01</text>
    <text x="72" y="166" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5" fill="#F8FAFC">Sahil Rajput</text>
    <rect x="74" y="190" width="74" height="4" rx="2" fill="url(#blue)"/>
    <text x="74" y="229" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" fill="#CBD5E1">Developer • Problem Solver • Builder</text>
    <text x="74" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">Turning ideas into practical digital experiences.</text>
    <text x="74" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B">GITHUB.COM/SAHILRAJPUT2266</text>
    <circle cx="1140" cy="38" r="3" fill="#38BDF8"/>
    <circle cx="1156" cy="38" r="3" fill="#38BDF8" opacity=".5"/>
    <circle cx="1172" cy="38" r="3" fill="#38BDF8" opacity=".25"/>
  </g>
</svg>