<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.15" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif; }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Light Glows -->
  <rect width="1200" height="380" rx="20" fill="url(#cyanGlow)" />
  <rect width="1200" height="380" rx="20" fill="url(#purpleGlow)" />
  <rect width="1200" height="380" rx="20" fill="url(#blueGlow)" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="380" rx="20" fill="url(#gridPattern)" />

  <!-- Left Side: Hero Info -->
  <g transform="translate(60, 50)">
    <!-- Status Badge -->
    <g transform="translate(0, 10)">
      <rect width="210" height="32" rx="16" fill="#0B132B" stroke="#2563EB" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10B981" />
      <circle cx="16" cy="16" r="9" fill="#10B981" fill-opacity="0.25" />
      <text x="32" y="21" fill="#E2E8F0" font-size="12" font-weight="600" class="font-sans">OPEN TO COLLABORATE</text>
    </g>

    <!-- Main Title / Name -->
    <text x="0" y="95" fill="url(#titleGrad)" font-size="50" font-weight="800" letter-spacing="-1" class="font-sans" filter="url(#shadow)">
      SAHIL CHAUHAN
    </text>

    <!-- Subtitle / Role -->
    <text x="2" y="132" fill="#F8FAFC" font-size="21" font-weight="600" letter-spacing="0.2" class="font-sans">
      Full-Stack Web Developer <tspan fill="#38BDF8">✦</tspan> MERN &amp; Next.js Architect
    </text>

    <!-- Bio Statement -->
    <text x="2" y="165" fill="#94A3B8" font-size="15" font-weight="400" class="font-sans">
      Architecting high-performance real-time applications &amp; immersive web experiences.
    </text>
    <text x="2" y="188" fill="#64748B" font-size="14" font-weight="400" class="font-sans">
      Creator of Zavio (Real-Time Mesh Chat) &amp; JobOrbit (Career ATS Engine).
    </text>

    <!-- Skill Highlights Badges -->
    <g transform="translate(0, 220)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="120" height="32" rx="8" fill="#111C33" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
        <text x="60" y="20" fill="#38BDF8" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">⚡ Real-Time</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(132, 0)">
        <rect width="138" height="32" rx="8" fill="#111C33" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1" />
        <text x="69" y="20" fill="#A5B4FC" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">🚀 MERN Stack</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(282, 0)">
        <rect width="126" height="32" rx="8" fill="#111C33" stroke="#34D399" stroke-opacity="0.3" stroke-width="1" />
        <text x="63" y="20" fill="#6EE7B7" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">🎯 UI / UX</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(420, 0)">
        <rect width="126" height="32" rx="8" fill="#111C33" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1" />
        <text x="63" y="20" fill="#FCD34D" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">🌐 REST APIs</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Developer Terminal Card -->
  <g transform="translate(680, 45)" filter="url(#shadow)">
    <!-- Terminal Box -->
    <rect width="460" height="290" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

    <!-- Terminal Header Bar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 444 0 C 452.84 0 460 7.16 460 16 L 460 42 L 0 42 Z" fill="#0A0F1D" fill-opacity="0.9" />
    <circle cx="24" cy="21" r="5.5" fill="#EF4444" />
    <circle cx="42" cy="21" r="5.5" fill="#F59E0B" />
    <circle cx="60" cy="21" r="5.5" fill="#10B981" />
    <text x="230" y="26" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle" class="font-mono">developer.config.ts</text>

    <!-- Code Block -->
    <g transform="translate(24, 68)" class="font-mono" font-size="13">
      <text y="0" fill="#64748B">// Developer Profile Manifest</text>
      
      <text y="24">
        <tspan fill="#F43F5E">const</tspan>
        <tspan fill="#F8FAFC"> sahil </tspan>
        <tspan fill="#38BDF8">=</tspan>
        <tspan fill="#F8FAFC"> {</tspan>
      </text>

      <text y="48">
        <tspan fill="#94A3B8">  name:</tspan>
        <tspan fill="#FDE047"> 'Sahil Chauhan'</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text y="72">
        <tspan fill="#94A3B8">  role:</tspan>
        <tspan fill="#FDE047"> 'Full-Stack Developer'</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text y="96">
        <tspan fill="#94A3B8">  craft:</tspan>
        <tspan fill="#F8FAFC"> [</tspan><tspan fill="#A78BFA">'React'</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#A78BFA">'Node'</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#A78BFA">'Sockets'</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#A78BFA">'MongoDB'</tspan><tspan fill="#F8FAFC">]</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text y="120">
        <tspan fill="#94A3B8">  projects:</tspan>
        <tspan fill="#F8FAFC"> [</tspan><tspan fill="#38BDF8">'Zavio'</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#38BDF8">'ERP'</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#38BDF8">'CRM'</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#38BDF8">'JobOrbit'</tspan><tspan fill="#F8FAFC">]</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text y="144">
        <tspan fill="#94A3B8">  status:</tspan>
        <tspan fill="#34D399"> 'Building &amp; Scaling Daily'</tspan>
      </text>

      <text y="168" fill="#F8FAFC">};</text>

      <text y="196">
        <tspan fill="#38BDF8">sahil</tspan><tspan fill="#94A3B8">.</tspan><tspan fill="#60A5FA">buildImpactfulSoftware</tspan><tspan fill="#F8FAFC">();</tspan>
        <tspan fill="#38BDF8" font-weight="700"> ▋</tspan>
      </text>
    </g>
  </g>
</svg>
